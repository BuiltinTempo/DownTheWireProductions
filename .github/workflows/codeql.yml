name: DTW JavaScript security analysis

on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.html"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze-javascript:
    name: analyze-javascript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze JavaScript
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: "/language:javascript-typescript"
