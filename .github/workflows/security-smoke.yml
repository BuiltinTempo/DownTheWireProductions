name: DTW security smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/security-smoke.yml"
      - "*.html"
      - "*.js"
      - "*.css"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-smoke.yml"
      - "*.html"
      - "*.js"
      - "*.css"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DTW_SITE: https://downthewire.live
      CALENDAR_API: https://mnzegijkceapujodqsar.supabase.co/functions/v1/contest-api
      DTW_LEAD_API: https://xefzruxeqmwxotorxmmh.supabase.co/functions/v1/dtw-lead-capture
      DTW_FIELD_API: https://xefzruxeqmwxotorxmmh.supabase.co/functions/v1/dtw-field-notes-signup
      DTW_INTAKE_API: https://xefzruxeqmwxotorxmmh.supabase.co/functions/v1/dtw-form-intake
      DTW_CHECKLIST_API: https://xefzruxeqmwxotorxmmh.supabase.co/functions/v1/dtw-checklist-download
    steps:
      - name: Check security policy across all public HTML source pages
        uses: actions/checkout@v4
      - name: Verify browser security policy is present in every public HTML page
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          for page in ./*.html; do
            case "$page" in ./google*.html) continue ;; esac
            if ! grep -Eqi 'http-equiv="Content-Security-Policy"' "$page"; then
              echo "FAIL: missing CSP on $page"
              exit 1
            fi
            if ! grep -Eqi 'name="referrer"' "$page"; then
              echo "FAIL: missing referrer policy on $page"
              exit 1
            fi
            checked=$((checked + 1))
          done
          if [ "$checked" -lt 25 ]; then
            echo "FAIL: expected at least 25 protected public pages; found $checked"
            exit 1
          fi
          echo "PASS: baseline browser policy exists across $checked public HTML pages"
      - name: Validate local JavaScript and safe URL fragment handling
        shell: bash
        run: |
          set -euo pipefail
          node --check site.js
          node --check motion.js
          if grep -Eq 'querySelector[[:space:]]*\([[:space:]]*(window\.)?location\.hash' site.js; then
            echo "FAIL: URL fragment passed directly into a CSS selector"
            exit 1
          fi
          for page in rent-panasonic-hcx2.html rent-ursa-broadcast-g2.html; do
            grep -q 'name="_captcha" value="true"' "$page"
            grep -q 'name="_honey"' "$page"
          done
          echo "PASS: JavaScript parses, fragment lookup is constrained, rental anti-spam markers preserved"
      - name: Check website deployment and public DNS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --retry-delay 2 --retry-connrefused --connect-timeout 10 --max-time 25 "$DTW_SITE/" -o /tmp/dtw-homepage.html
          grep -qi '<meta http-equiv="Content-Security-Policy"' /tmp/dtw-homepage.html
          grep -q 'dtw-form-intake' /tmp/dtw-homepage.html
          echo "PASS: production homepage serves the current secure form and CSP metadata"
          for page in about.html resources.html rent-panasonic-hcx2.html; do
            curl -fsSL --retry 2 --retry-delay 2 --retry-connrefused --connect-timeout 10 --max-time 25 "$DTW_SITE/$page" -o "/tmp/dtw-$page"
            grep -qi 'http-equiv="Content-Security-Policy"' "/tmp/dtw-$page"
          done
          echo "PASS: public service, resource, and rental pages serve browser policy"
          echo "Authoritative DNS name servers:"
          dig +short NS downthewire.live | sort
          echo "Business-domain DMARC:"
          dig +short TXT _dmarc.downthewire.productions | grep -i 'v=DMARC1'
          echo "Public HTTP response headers (informational; not proof of full hardening):"
          curl -sSIL --retry 2 --retry-delay 2 --retry-connrefused --connect-timeout 10 --max-time 25 "$DTW_SITE/" |
            grep -iE '^(HTTP/|strict-transport-security:|content-security-policy:|x-frame-options:|x-content-type-options:|referrer-policy:)' || true
      - name: Check public calendar read API without casting a vote
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl -sS --retry 2 --retry-delay 2 --retry-connrefused --connect-timeout 10 --max-time 25 -o /tmp/calendar-state.json -w '%{http_code}' \
            -H 'Origin: https://downthewire.live' -H 'Content-Type: application/json' \
            -d '{"fn":"get_public_state","args":{}}' "$CALENDAR_API")"
          if [ "$status" != 200 ]; then
            echo "FAIL: calendar public state endpoint returned HTTP $status"
            exit 1
          fi
          python3 - <<'PY'
          import json
          state = json.load(open("/tmp/calendar-state.json"))
          assert isinstance(state, dict), "Public API must return an object"
          assert isinstance(state.get("photos"), list), "Missing public photos"
          assert isinstance(state.get("rounds"), list), "Missing public rounds"
          assert isinstance(state.get("contest"), dict), "Missing public contest state"
          print("PASS: public calendar API returns expected state structure; no votes created")
          PY
          status="$(curl -sS --retry 2 --retry-delay 2 --retry-connrefused --connect-timeout 10 --max-time 25 -o /tmp/calendar-badid.json -w '%{http_code}' \
            -H 'Origin: https://downthewire.live' -H 'Content-Type: application/json' \
            -d '{"fn":"get_public_voter_state","args":{"p_voter_id":"judge:invalid"}}' "$CALENDAR_API")"
          if [ "$status" != 400 ]; then
            echo "FAIL: malformed voter ID expected 400 but returned $status"
            exit 1
          fi
          echo "PASS: malformed or reserved voter ID rejected"
      - name: Verify DTW public API method and token boundaries without creating records
        shell: bash
        run: |
          set -euo pipefail
          check_get() {
            local label="$1" url="$2" expected="$3" status
            # curl retries transient connection/timeouts and retryable 5xx only.
            # 405/403 are the expected terminal responses, not treated as failures by curl.
            if ! status="$(curl -sS --retry 2 --retry-delay 2 --retry-connrefused \
              --connect-timeout 10 --max-time 25 -o /dev/null -w '%{http_code}' "$url")"; then
              echo "FAIL: $label unreachable after transient-failure retries"
              return 1
            fi
            if [ "$status" != "$expected" ]; then
              echo "FAIL: $label expected HTTP $expected, got HTTP $status"
              return 1
            fi
            echo "PASS: $label returned expected HTTP $expected without inserting data"
          }
          check_get "lead capture GET" "$DTW_LEAD_API" 405
          check_get "Field Notes GET" "$DTW_FIELD_API" 405
          check_get "project/rental intake GET" "$DTW_INTAKE_API" 405
          check_get "checklist download without token" "$DTW_CHECKLIST_API" 403
