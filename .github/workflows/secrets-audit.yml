name: DTW credential leak scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "47 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-credentials:
    name: scan-credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks binary
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 3 \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check -
          mkdir -p /tmp/dtw-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/dtw-gitleaks gitleaks
          chmod 0755 /tmp/dtw-gitleaks/gitleaks
          /tmp/dtw-gitleaks/gitleaks version
      - name: Scan committed Git history for exposed secrets
        shell: bash
        run: |
          set -euo pipefail
          /tmp/dtw-gitleaks/gitleaks git . --no-banner --redact
      - name: Scan checked-out files for exposed secrets
        shell: bash
        run: |
          set -euo pipefail
          /tmp/dtw-gitleaks/gitleaks dir . --no-banner --redact
